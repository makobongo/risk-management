services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: risk-management-app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - maven_cache:/root/.m2
    working_dir: /app
    depends_on:
      - mysql
  mysql:
    image: mysql:8.4
    container_name: risk-management-mysql
    environment:
      MYSQL_DATABASE: risk_management
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin@123
      MYSQL_ROOT_PASSWORD: admin@123
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
volumes:
    maven_cache:
    mysql_data: